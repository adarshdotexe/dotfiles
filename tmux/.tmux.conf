# ---------- prefix ----------
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ---------- general ----------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*-256color:RGB"

set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi

# ---------- key bindings ----------
bind r source-file ~/.tmux.conf \; display "tmux config reloaded"
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window      -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# sesh popup picker (needs tmux >= 3.2)
bind-key "K" run-shell "sesh connect \"$(
  sesh list -i | fzf-tmux -p 55%,60% --no-sort --ansi --border-label ' sesh ' --prompt '> ' \
    --header '^a all  ^t tmux  ^g configs  ^x zoxide  ^d tmux kill'
)\""

# Last session toggle (Prefix + space = jump to previous session)
bind Space switch-client -l

# ---------- status line ----------
set -g status-position top
set -g status-interval 5
set -g status-style "bg=default,fg=cyan"
set -g status-left-length 40
set -g status-right-length 60
set -g status-left  '#[fg=green,bold] #S #[fg=default]| '
set -g status-right '#[fg=yellow]#(whoami)@#h #[fg=default]| #[fg=cyan]%a %d-%b #[fg=white]%H:%M '

set -g window-status-format          ' #I:#W '
set -g window-status-current-format  '#[fg=black,bg=cyan,bold] #I:#W '
set -g pane-border-style       fg=brightblack
set -g pane-active-border-style fg=cyan

# ---------- visual ----------
set -g set-clipboard on
