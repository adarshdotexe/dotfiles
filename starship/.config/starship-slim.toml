# ~/.config/starship-slim.toml -- managed by dotfiles.
# Flat single-line variant for tcsh (whose prompt-width counting breaks on
# $fill + multi-line + many ANSI escapes) and for the tmux info-line profile.
# Same flat, transparency-friendly palette as the main config, but on one line
# with no $fill and no right-hand chain (status/time live elsewhere).
# Codepoints: https://www.nerdfonts.com/cheat-sheet
# Requires a Nerd Font in the terminal (we ship MesloLGS Nerd Font Mono).

# Top-level keys must precede any [table] header (TOML scoping).
palette = "modern"
add_newline = false

format = "$os$directory$git_branch$git_status$python$nodejs$golang$rust$java$docker_context$kubernetes$terraform$aws$gcloud$azure$direnv$nix_shell$character"

# Profiles: starship renders different prompts depending on the --profile flag.
# Used by tmux to render the info-line, and by the zsh zle-line-finish hook for
# transient prompt collapse.
[profiles]
transient = "$character"
tmux-info = "$git_branch$git_status$python$nodejs$golang$rust$java$docker_context$kubernetes$terraform$aws$gcloud$azure$direnv$nix_shell"

[palettes.modern]
rule    = "#6c7086"
os      = "#89b4fa"
dir     = "#89dceb"
git     = "#a6e3a1"
gitwarn = "#f9e2af"
lang    = "#cba6f7"
ok      = "#a6e3a1"
err     = "#f38ba8"
warn    = "#f9e2af"
host    = "#94e2d5"
muted   = "#7f849c"

[os]
disabled = false
format = "[$symbol ](fg:os)"

[os.symbols]
Alpine = "\uf300"
Amazon = "\uf270"
Android = "\uf17b"
Arch = "\uf303"
CentOS = "\uf304"
Debian = "\uf306"
Fedora = "\uf30a"
FreeBSD = "\uf30c"
Gentoo = "\uf30d"
Linux = "\uf17c"
Macos = "\uf179"
Manjaro = "\uf312"
Mint = "\uf30e"
NixOS = "\uf313"
openSUSE = "\uf314"
Pop = "\uf32a"
Raspbian = "\uf315"
Redhat = "\uf316"
RedHatEnterprise = "\uf316"
Ubuntu = "\uf31b"
Windows = "\uf17a"
Unknown = "\uf17c"

[directory]
format = "[$path ](fg:dir bold)"
truncation_length = 4
truncation_symbol = "\u2026/"
read_only = " \uf023"
read_only_style = "fg:err"
home_symbol = "~"

[directory.substitutions]
"/home/scratch.advarshney_gpu" = "scratch"

[git_branch]
symbol = "\uf126 "
format = "[$symbol$branch ](fg:git)"

[git_status]
format = "[$all_status$ahead_behind ](fg:gitwarn)"
modified    = "\u00b1"
staged      = "+"
deleted     = "\u2718"
untracked   = "?"
renamed     = "\u00bb"
ahead       = "\u21e1${count}"
behind      = "\u21e3${count}"
diverged    = "\u21d5\u21e1${ahead_count}\u21e3${behind_count}"
stashed     = "*"
conflicted  = "!"

[python]
symbol = "\ue73c "
format = "[$symbol$pyenv_prefix(\\($virtualenv\\) )($version) ](fg:lang)"

[nodejs]
symbol = "\ue718 "
format = "[$symbol($version) ](fg:lang)"

[golang]
symbol = "\ue627 "
format = "[$symbol($version) ](fg:lang)"

[rust]
symbol = "\ue7a8 "
format = "[$symbol($version) ](fg:lang)"

[java]
symbol = "\ue738 "
format = "[$symbol($version) ](fg:lang)"

[docker_context]
symbol = "\uf308 "
format = "[$symbol$context ](fg:lang)"

[kubernetes]
disabled = false
symbol = "\u2638 "
format = "[$symbol$context\\($namespace\\) ](fg:lang)"

[terraform]
symbol = "\uf1bb "
format = "[$symbol$workspace ](fg:lang)"

[aws]
symbol = "\uf270 "
format = "[$symbol$profile(\\($region\\)) ](fg:lang)"

[gcloud]
symbol = "\ue7f1 "
format = "[$symbol$account\\($project\\) ](fg:lang)"

[azure]
symbol = "\uebd8 "
format = "[$symbol$subscription ](fg:lang)"

[direnv]
disabled = false
symbol = "\uf013 "
format = "[$symbol$loaded$allowed ](fg:lang)"

[nix_shell]
symbol = "\uf313 "
format = "[$symbol$state\\($name\\) ](fg:lang)"

[status]
disabled = false
symbol = "\u2718 "
format = "[$symbol$status ](fg:err bold)"

[cmd_duration]
min_time = 500
format = "[\uf017 $duration ](fg:warn)"

[jobs]
symbol = "\uf013 "
format = "[$symbol$number ](fg:warn)"
number_threshold = 1

[username]
disabled = true

[hostname]
disabled = true
ssh_only = false
format = "[$hostname ](fg:host bold)"

[time]
disabled = false
format = "[\uf017 $time ](fg:muted)"
time_format = "%I:%M %p"

[shell]
disabled = false
format = "[$indicator ](fg:muted)"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
tcsh_indicator = "tcsh"
powershell_indicator = "pwsh"
cmd_indicator = "cmd"
nu_indicator = "nu"
unknown_indicator = "sh"

[character]
success_symbol = "[\u276f](bold fg:ok)"
error_symbol   = "[\u276f](bold fg:err)"
vimcmd_symbol  = "[\u276e](bold fg:warn)"
