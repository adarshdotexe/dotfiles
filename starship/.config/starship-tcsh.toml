# ~/.config/starship-tcsh.toml -- derived from starship.toml.
# tcsh prompt-width calculation breaks on $fill + multi-line + ANSI escapes,
# so this slim variant drops $fill and the right chain.
# Codepoints: https://www.nerdfonts.com/cheat-sheet
# Requires a Nerd Font in the terminal (we ship MesloLGS Nerd Font Mono).

format = """[\u256d\u2500](fg:#8a8a8a)[ $os ](bg:#3465A4 fg:#FFFFFF)$directory$git_branch$git_status$python$nodejs$golang$rust$java$docker_context$kubernetes$terraform$aws$gcloud$azure$direnv$nix_shell[\ue0b0](fg:prev_bg)
[\u2570\u2500](fg:#8a8a8a)$shell$character"""

add_newline = false

# Transient prompt profile for the zsh zle-line-finish hook.
[profiles]
transient = "$character"

[fill]
symbol = " "
style = "fg:#444444"

# OS pill (always first; leading arrow lives in the main format above)
[os]
disabled = false
format = "[$symbol ]($style)"
style = "bg:#3465A4 fg:#FFFFFF"

[os.symbols]
Alpine = "\uf300"
Amazon = "\uf270"
Android = "\uf17b"
Arch = "\uf303"
CentOS = "\uf304"
Debian = "\uf306"
Fedora = "\uf30a"
FreeBSD = "\uf30c"
Gentoo = "\uf30d"
Linux = "\uf17c"
Macos = "\uf179"
Manjaro = "\uf312"
Mint = "\uf30e"
NixOS = "\uf313"
openSUSE = "\uf314"
Pop = "\uf32a"
Raspbian = "\uf315"
Redhat = "\uf316"
RedHatEnterprise = "\uf316"
Ubuntu = "\uf31b"
Windows = "\uf17a"
Unknown = "\uf17c"

[directory]
format = "[\ue0b0](fg:prev_bg bg:#0087AF)[ \uf07c $path ]($style)"
style = "bg:#0087AF fg:#FFFFFF bold"
truncation_length = 4
truncation_symbol = "\u2026/"
read_only = " \uf023 "
read_only_style = "bg:#0087AF fg:#FF5F00"
home_symbol = "~"

[directory.substitutions]
"/home/scratch.advarshney_gpu" = "scratch"

[git_branch]
symbol = "\uf126"
format = "[\ue0b0](fg:prev_bg bg:#5F8700)[ $symbol $branch ]($style)"
style = "bg:#5F8700 fg:#000000 bold"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bg:#5F8700 fg:#AA0000 bold"
modified    = "\u00b1 "
staged      = "+ "
deleted     = "\u2718 "
untracked   = "? "
renamed     = "\u00bb "
ahead       = "\u21e1${count}"
behind      = "\u21e3${count}"
diverged    = "\u21d5\u21e1${ahead_count}\u21e3${behind_count}"
stashed     = "* "
conflicted  = "! "

# Languages: all share #5F87AF bg; same-color transitions are invisible
# so adjacent languages render as one continuous pill.
[python]
symbol = "\ue73c"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $pyenv_prefix($version )(\\($virtualenv\\) ) ]($style)"
style = "bg:#5F87AF fg:#000000 bold"

[nodejs]
symbol = "\ue718"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol ($version) ]($style)"
style = "bg:#5F87AF fg:#000000 bold"

[golang]
symbol = "\ue627"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol ($version) ]($style)"
style = "bg:#5F87AF fg:#000000 bold"

[rust]
symbol = "\ue7a8"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol ($version) ]($style)"
style = "bg:#5F87AF fg:#000000 bold"

[java]
symbol = "\ue738"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol ($version) ]($style)"
style = "bg:#5F87AF fg:#000000 bold"

[docker_context]
symbol = "\uf308"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $context ]($style)"
style = "bg:#5F87AF fg:#000000 bold"

[kubernetes]
disabled = false
symbol = "\u2638 "
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $context\\($namespace\\) ]($style)"
style = "bg:#5F87AF fg:#000000"

[terraform]
symbol = "\uf1bb"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $workspace ]($style)"
style = "bg:#5F87AF fg:#000000"

[aws]
symbol = "\uf270"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $profile(\\($region\\)) ]($style)"
style = "bg:#5F87AF fg:#000000"

[gcloud]
symbol = "\ue7f1 "
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $account\\($project\\) ]($style)"
style = "bg:#5F87AF fg:#000000"

[azure]
symbol = "\uebd8 "
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $subscription ]($style)"
style = "bg:#5F87AF fg:#000000"

[direnv]
disabled = false
symbol = "\uf013"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $loaded$allowed ]($style)"
style = "bg:#5F87AF fg:#000000"

[nix_shell]
symbol = "\uf313"
format = "[\ue0b0](fg:prev_bg bg:#5F87AF)[ $symbol $state\\($name\\) ]($style)"
style = "bg:#5F87AF fg:#000000"

# Right side: solo left-cap per segment (no cross-fill prev_bg).
[status]
disabled = false
symbol = "\u2718 "
format = "[\ue0b2](fg:#AF0000 bg:prev_bg)[ $symbol$status ](bg:#AF0000 fg:#FFFFFF bold)"

[cmd_duration]
min_time = 500
format = "[\ue0b2](fg:#AF8700 bg:prev_bg)[ \uf017 $duration ]($style)"
style = "bg:#AF8700 fg:#FFFFFF bold"

[jobs]
symbol = "\uf013 "
format = "[$symbol$number ]($style)"
style = "bg:#AF8700 fg:#FFFFFF bold"
number_threshold = 1

[username]
show_always = true
format = "[\ue0b2](fg:#3A3A3A bg:prev_bg)[ \uf007 $user ]($style)"
style_user = "bg:#3A3A3A fg:#FFFFFF bold"
style_root = "bg:#3A3A3A fg:#FF0000 bold"

[hostname]
ssh_only = false
format = "[@$hostname ]($style)"
style = "bg:#3A3A3A fg:#FFFFFF bold"

[time]
disabled = false
format = "[\ue0b2](fg:#005F5F bg:prev_bg)[ \uf017 $time ]($style)"
style = "bg:#005F5F fg:#FFFFFF bold"
time_format = "%I:%M:%S %p"

[shell]
disabled = false
format = "[$indicator ]($style)"
style = "fg:#8a8a8a"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
tcsh_indicator = "tcsh"
powershell_indicator = "pwsh"
cmd_indicator = "cmd"
nu_indicator = "nu"
unknown_indicator = "sh"

[character]
success_symbol = "[\u276f](bold fg:#5fd700)"
error_symbol   = "[\u276f](bold fg:#ff0000)"
vimcmd_symbol  = "[\u276e](bold fg:#ffff00)"
