# ~/.config/starship.toml — managed by dotfiles. Shared by zsh, bash, tcsh,
# PowerShell, and cmd (via Clink). Closely mimics the powerlevel10k rainbow-
# style two-line prompt with nerd-font glyphs (requires MesloLGS NF or another
# Nerd Font in the terminal).
#
# All glyphs are written as \uXXXX TOML escapes so the file stays pure ASCII
# on disk and the bytes can never be stripped by an editor / sync tool.
# Codepoints reference: https://www.nerdfonts.com/cheat-sheet

format = """\
[╭─](#8a8a8a)$os $directory$git_branch$git_status$python$nodejs$golang$rust$java$docker_context$kubernetes$terraform$aws$gcloud$azure$direnv$nix_shell$fill$status$cmd_duration$jobs$username$hostname$time
[╰─](#8a8a8a)$shell$character"""

add_newline = false

[fill]
symbol = " "
style = "fg:#444444"

# ── OS identifier (nerd-font glyphs) ────────────────────────────────────────
[os]
disabled = false
format = "[$symbol]($style)"
style = "bold #ffffff"

[os.symbols]
Alpine        = " "  # nf-linux-alpine
Amazon        = " "  # nf-fa-amazon
Android       = " "  # nf-fa-android
Arch          = " "  # nf-linux-archlinux
CentOS        = " "  # nf-linux-centos
Debian        = " "  # nf-linux-debian
Fedora        = " "  # nf-linux-fedora
FreeBSD       = " "  # nf-linux-freebsd
Gentoo        = " "  # nf-linux-gentoo
Linux         = " "  # nf-linux-tux
Macos         = " "  # nf-linux-apple
Manjaro       = " "  # nf-linux-manjaro
Mint          = " "  # nf-linux-mint
NixOS         = " "  # nf-linux-nixos
openSUSE      = " "  # nf-linux-opensuse
Pop           = " "  # nf-linux-pop_os
Raspbian      = " "  # nf-linux-raspberry_pi
Redhat        = " "  # nf-linux-redhat
RedHatEnterprise = " "
Ubuntu        = " "  # nf-linux-ubuntu
Windows       = " "  # nf-fa-windows
Unknown       = " "  # nf-fa-linux

# ── Working directory ───────────────────────────────────────────────────────
[directory]
format = "[ $path]($style) "
style = "bold fg:#0087af"
truncation_length = 4
truncation_symbol = "…/"
read_only = "  "                   # padlock
read_only_style = "fg:#ff5f00"
home_symbol = "~"

[directory.substitutions]
"/home/scratch.advarshney_gpu" = "scratch"

# ── Git ─────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "                       # nf-fa-code_fork
format = "on [$symbol$branch ]($style)"
style = "bold fg:#5fd700"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bold fg:#ff0000"
modified    = "± "                  # ±
staged      = "+ "
deleted     = "✘ "                  # ✘
untracked   = "? "
renamed     = "» "                  # »
ahead       = "⇡${count}"           # ⇡
behind      = "⇣${count}"           # ⇣
diverged    = "⇕⇡${ahead_count}⇣${behind_count}"
stashed     = "* "
conflicted  = "! "

# ── Languages ───────────────────────────────────────────────────────────────
[python]
symbol = " "                       # nf-dev-python
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style) '
style = "bold fg:#5fafff"

[nodejs]
symbol = " "                       # nf-dev-nodejs_small
format = '[$symbol($version) ]($style) '
style = "bold fg:#5fd700"

[golang]
symbol = " "                       # nf-dev-go
format = '[$symbol($version) ]($style) '
style = "bold fg:#00d7d7"

[rust]
symbol = " "                       # nf-dev-rust
format = '[$symbol($version) ]($style) '
style = "bold fg:#ff5f00"

[java]
symbol = " "                       # nf-dev-java
format = '[$symbol($version) ]($style) '
style = "bold fg:#ff5f00"

# ── Cloud / orchestration ───────────────────────────────────────────────────
[docker_context]
symbol = " "                       # nf-linux-docker
format = '[$symbol$context ]($style) '
style = "bold fg:#005fff"

[kubernetes]
disabled = false
symbol = "☸ "                       # ☸ (BMP fallback; cleaner than k8s glyph)
format = '[$symbol$context\($namespace\) ]($style) '
style = "fg:#5fafff"

[terraform]
symbol = " "                       # nf-fa-tree (terraform-like)
format = '[$symbol$workspace ]($style) '
style = "fg:#af87ff"

[aws]
symbol = " "                       # nf-fa-amazon
format = '[$symbol$profile(\($region\)) ]($style) '
style = "fg:#ffaf00"

[gcloud]
symbol = "☁ "                       # ☁
format = '[$symbol$account\($project\) ]($style) '
style = "fg:#0087ff"

[azure]
symbol = "☁ "                       # ☁
format = '[$symbol$subscription ]($style) '
style = "fg:#0087ff"

[direnv]
disabled = false
symbol = " "                       # nf-fa-cog
format = '[$symbol$loaded$allowed ]($style) '
style = "fg:#ffaf00"

[nix_shell]
symbol = " "                       # nf-linux-nixos
format = '[$symbol$state\($name\) ]($style) '
style = "fg:#5fafff"

# ── Right side ──────────────────────────────────────────────────────────────
[status]
disabled = false
symbol = "✘ "                       # ✘
format = "[$symbol$status]($style) "
style = "bold fg:#ff0000"

[cmd_duration]
min_time = 500
format = "[⏱ $duration]($style) "   # ⏱
style = "bold fg:#ffaf00"

[jobs]
symbol = " "                       # nf-fa-cog
format = "[$symbol$number]($style) "
style = "bold fg:#ffaf00"
number_threshold = 1

[username]
show_always = true
format = "[ $user]($style)"        # nf-fa-user
style_user = "bold fg:#5fd75f"
style_root = "bold fg:#ff0000"

[hostname]
ssh_only = false
format = "@[$hostname ]($style)"
style = "bold fg:#5fd75f"

[time]
disabled = false
format = "[  $time ]($style)"      # nf-fa-clock_o
style = "bold fg:#ffffff bg:#005f5f"
time_format = "%H:%M:%S"

# ── Line 2 ──────────────────────────────────────────────────────────────────
[shell]
disabled = false
format = "[$indicator]($style) "
style = "bold dimmed white"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
tcsh_indicator = "tcsh"
powershell_indicator = "pwsh"
cmd_indicator = "cmd"
nu_indicator = "nu"
unknown_indicator = "sh"

[character]
success_symbol = "[❯](bold fg:#5fd700)"   # ❯
error_symbol   = "[❯](bold fg:#ff0000)"
vimcmd_symbol  = "[❮](bold fg:#ffff00)"   # ❮
