# ~/.config/starship.toml — managed by dotfiles. Shared by zsh, bash, tcsh,
# PowerShell, and cmd (via Clink). Pastel-powerline aesthetic with nerd-font
# glyphs. All non-ASCII bytes are written as \uXXXX TOML escapes so the file
# stays pure ASCII on disk and the Write/sync chain can never strip them.
#
# Codepoints reference: https://www.nerdfonts.com/cheat-sheet
# Requires a Nerd Font in the terminal (we ship MesloLGS Nerd Font Mono).

format = """\
[╭─](fg:#8a8a8a) \
[](fg:#3465A4)\
[ $os  ](bg:#3465A4 fg:#FFFFFF)\
[](fg:#3465A4 bg:#0087AF)\
$directory\
[](fg:#0087AF bg:#5F8700)\
$git_branch\
$git_status\
[](fg:#5F8700 bg:#5F87AF)\
$python\
$nodejs\
$golang\
$rust\
$java\
$docker_context\
$kubernetes\
$terraform\
$aws\
$gcloud\
$azure\
$direnv\
$nix_shell\
[](fg:#5F87AF)\
$fill\
$status\
[](fg:#AF8700)\
$cmd_duration\
$jobs\
[](fg:#3A3A3A bg:#AF8700)\
$username\
$hostname\
[](fg:#005F5F bg:#3A3A3A)\
$time\
[](fg:#005F5F)
[╰─](fg:#8a8a8a)$shell$character"""

add_newline = false

[fill]
symbol = " "
style = "fg:#444444"

# ── OS ──────────────────────────────────────────────────────────────────────
[os]
disabled = false
format = "[$symbol]($style)"
style = "bg:#3465A4 fg:#FFFFFF"

[os.symbols]
Alpine           = " "
Amazon           = " "
Android          = " "
Arch             = " "
CentOS           = " "
Debian           = " "
Fedora           = " "
FreeBSD          = " "
Gentoo           = " "
Linux            = " "
Macos            = " "
Manjaro          = " "
Mint             = " "
NixOS            = " "
openSUSE         = " "
Pop              = " "
Raspbian         = " "
Redhat           = " "
RedHatEnterprise = " "
Ubuntu           = " "
Windows          = " "
Unknown          = " "

# ── Working directory ───────────────────────────────────────────────────────
[directory]
format = "[  $path ]($style)"
style = "bg:#0087AF fg:#FFFFFF bold"
truncation_length = 4
truncation_symbol = "…/"
read_only = "  "
read_only_style = "bg:#0087AF fg:#FF5F00"
home_symbol = "~"

[directory.substitutions]
"/home/scratch.advarshney_gpu" = "scratch"

# ── Git ─────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
format = "[ $symbol$branch ]($style)"
style = "bg:#5F8700 fg:#000000 bold"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bg:#5F8700 fg:#AA0000 bold"
modified    = "± "
staged      = "+ "
deleted     = "✘ "
untracked   = "? "
renamed     = "» "
ahead       = "⇡${count}"
behind      = "⇣${count}"
diverged    = "⇕⇡${ahead_count}⇣${behind_count}"
stashed     = "* "
conflicted  = "! "

# ── Languages (all use the same blue background) ────────────────────────────
[python]
symbol = " "
format = '[ $symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
style = "bg:#5F87AF fg:#000000 bold"

[nodejs]
symbol = " "
format = '[ $symbol($version) ]($style)'
style = "bg:#5F87AF fg:#000000 bold"

[golang]
symbol = " "
format = '[ $symbol($version) ]($style)'
style = "bg:#5F87AF fg:#000000 bold"

[rust]
symbol = " "
format = '[ $symbol($version) ]($style)'
style = "bg:#5F87AF fg:#000000 bold"

[java]
symbol = " "
format = '[ $symbol($version) ]($style)'
style = "bg:#5F87AF fg:#000000 bold"

[docker_context]
symbol = " "
format = '[ $symbol$context ]($style)'
style = "bg:#5F87AF fg:#000000 bold"

[kubernetes]
disabled = false
symbol = "☸ "
format = '[ $symbol$context\($namespace\) ]($style)'
style = "bg:#5F87AF fg:#000000"

[terraform]
symbol = " "
format = '[ $symbol$workspace ]($style)'
style = "bg:#5F87AF fg:#000000"

[aws]
symbol = " "
format = '[ $symbol$profile(\($region\)) ]($style)'
style = "bg:#5F87AF fg:#000000"

[gcloud]
symbol = "☁ "
format = '[ $symbol$account\($project\) ]($style)'
style = "bg:#5F87AF fg:#000000"

[azure]
symbol = "☁ "
format = '[ $symbol$subscription ]($style)'
style = "bg:#5F87AF fg:#000000"

[direnv]
disabled = false
symbol = " "
format = '[ $symbol$loaded$allowed ]($style)'
style = "bg:#5F87AF fg:#000000"

[nix_shell]
symbol = " "
format = '[ $symbol$state\($name\) ]($style)'
style = "bg:#5F87AF fg:#000000"

# ── Right side ──────────────────────────────────────────────────────────────
[status]
disabled = false
symbol = "✘ "
format = "[](fg:#AF0000)[ $symbol$status ](bg:#AF0000 fg:#FFFFFF bold)[](fg:#AF0000)"

[cmd_duration]
min_time = 500
format = "[  $duration ]($style)"
style = "bg:#AF8700 fg:#FFFFFF bold"

[jobs]
symbol = " "
format = "[ $symbol$number ]($style)"
style = "bg:#AF8700 fg:#FFFFFF bold"
number_threshold = 1

[username]
show_always = true
format = "[  $user]($style)"
style_user = "bg:#3A3A3A fg:#FFFFFF bold"
style_root = "bg:#3A3A3A fg:#FF0000 bold"

[hostname]
ssh_only = false
format = "@[$hostname ]($style)"
style = "bg:#3A3A3A fg:#FFFFFF bold"

[time]
disabled = false
format = "[  $time ]($style)"
style = "bg:#005F5F fg:#FFFFFF bold"
time_format = "%I:%M:%S %p"

# ── Line 2 ──────────────────────────────────────────────────────────────────
[shell]
disabled = false
format = "[$indicator ]($style)"
style = "fg:#8a8a8a"
bash_indicator = "bash"
zsh_indicator = "zsh"
fish_indicator = "fish"
tcsh_indicator = "tcsh"
powershell_indicator = "pwsh"
cmd_indicator = "cmd"
nu_indicator = "nu"
unknown_indicator = "sh"

[character]
success_symbol = "[❯](bold fg:#5fd700)"
error_symbol   = "[❯](bold fg:#ff0000)"
vimcmd_symbol  = "[❮](bold fg:#ffff00)"
