add_newline = false
command_timeout = 800

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$bun\
$deno\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[->](bold green)"
error_symbol   = "[->](bold red)"

[username]
show_always = false
style_user  = "cyan"
format      = "[$user]($style)@"

[hostname]
ssh_only = true
format   = "[$hostname](bold yellow) "

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold blue"

[git_branch]
symbol = " "
style  = "purple"

[git_status]
ahead     = "↑${count}"
behind    = "↓${count}"
diverged  = "↑${ahead_count}↓${behind_count}"
conflicted = "✖"
modified  = "*"
staged    = "+"
untracked = "?"
stashed   = "$"

[cmd_duration]
min_time = 2000
format   = "[$duration](yellow) "

[python]
symbol = " "
format = "[${symbol}${version}]($style) "

[nodejs]
symbol = " "
format = "[${symbol}${version}]($style) "

[bun]
symbol = " "
format = "[${symbol}${version}]($style) "

[deno]
symbol = " "
format = "[${symbol}${version}]($style) "
