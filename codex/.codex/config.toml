# ~/.codex/config.toml — managed by dotfiles
#
# Codex does not consult OPENAI_BASE_URL/OPENAI_MODEL on its own; it looks up
# the provider here and reads the API key from the env var named by env_key.
# Set OPENAI_API_KEY in your shell (the dotfiles bash/zsh/csh blocks mirror it
# from $ANTHROPIC_API_KEY since the NVIDIA inference gateway accepts the same
# key for both wire formats).

model = "openai/openai/gpt-5.5"
model_provider = "nvidia"

[model_providers.nvidia]
name = "NVIDIA Inference Gateway"
base_url = "https://inference-api.nvidia.com/v1/"
env_key = "OPENAI_API_KEY"
wire_api = "responses"
