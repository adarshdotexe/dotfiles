# Minimal sesh config. No pre-configured project sessions — let sesh discover
# what's available on each host via its three default sources:
#
#   - zoxide directories (cd somewhere once and it's pickable)
#   - existing tmux sessions
#   - ssh hosts from ~/.ssh/config
#
# `sesh connect <name>` does fuzzy resolution across all three. Inside tmux,
# Prefix + K opens an interactive picker.

default_session = { startup_command = "" }
